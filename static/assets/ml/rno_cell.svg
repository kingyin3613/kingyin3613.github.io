hor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#444">σ  ←  g(ξ, ε)</text><line x1="480" y1="70" x2="480" y2="120" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="472" y="100" text-anchor="end" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">ε(t), Δε</text><line x1="480" y1="230" x2="480" y2="285" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="472" y="262" text-anchor="end" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">σ(t)</text><rect x="680" y="120" width="160" height="110" rx="10" fill="#dff0e6" stroke="#2e8b57" stroke-width="2"/><text x="760.0" y="146" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#2e8b57">RNO cell  t₃</text><text x="760.0" y="170" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#444">ξ  ←  f(ξ, Δε)</text><text x="760.0" y="190" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#444">σ  ←  g(ξ, ε)</text><line x1="760" y1="70" x2="760" y2="120" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="752" y="100" text-anchor="end" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">ε(t), Δε</text><line x1="760" y1="230" x2="760" y2="285" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="752" y="262" text-anchor="end" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">σ(t)</text><line x1="280" y1="175" x2="400" y2="175" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="340.0" y="167.0" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">ξ (internal variables)</text><line x1="560" y1="175" x2="680" y2="175" stroke="#444" stroke-width="2" marker-end="url(#ar)"/><text x="620.0" y="167.0" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#444">ξ</text><text x="450" y="315" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#666">Hidden internal variables ξ carry loading-history information between increments, mirroring classical plasticity.</text></svg>