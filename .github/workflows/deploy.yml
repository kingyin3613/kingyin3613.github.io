name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (neural network gradient check)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # URL of the deployed Cloudflare Worker, set as a repository variable.
          # Leave it unset and the site ships with its offline guide.
          VITE_CLAUDE_ENDPOINT: ${{ vars.CLAUDE_ENDPOINT }}

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
